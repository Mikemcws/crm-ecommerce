<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM | Clientes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h2>📦 CRM Store</h2>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </a>
      <a href="clientes.html" class="nav-item active">
        <span class="nav-icon">👥</span>
        <span>Clientes</span>
      </a>
      <a href="leads.html" class="nav-item">
        <span class="nav-icon">🎯</span>
        <span>Leads</span>
      </a>
      <a href="tarefas.html" class="nav-item">
        <span class="nav-icon">✅</span>
        <span>Tarefas</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button id="btn-logout">🚪 Sair</button>
    </div>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main-content">
    <header class="page-header">
      <h1>Clientes</h1>
      <p>Gerencie sua base de clientes</p>
    </header>

    <!-- AÇÕES -->
    <div class="acoes-bar">
      <input type="text" id="busca" placeholder="🔍 Buscar por nome...">
      <div class="filtros">
        <button class="filtro-btn active" data-tag="todos">Todos</button>
        <button class="filtro-btn" data-tag="VIP">VIP</button>
        <button class="filtro-btn" data-tag="Lead">Lead</button>
        <button class="filtro-btn" data-tag="Inativo">Inativo</button>
      </div>
      <button id="btn-novo-cliente">+ Novo Cliente</button>
    </div>

    <!-- LISTA DE CLIENTES -->
    <div id="lista-clientes" class="cards-grid">
      <!-- cards gerados pelo JS -->
    </div>
  </main>

  <!-- MODAL -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-titulo">Novo Cliente</h2>
        <button id="btn-fechar-modal">✕</button>
      </div>

      <div class="modal-body">
        <div class="input-group">
          <label>Nome</label>
          <input type="text" id="campo-nome" placeholder="Nome completo">
        </div>
        <div class="input-group">
          <label>E-mail</label>
          <input type="email" id="campo-email" placeholder="email@exemplo.com">
        </div>
        <div class="input-group">
          <label>Telefone</label>
          <input type="text" id="campo-telefone" placeholder="(11) 99999-9999">
        </div>
        <div class="input-group">
          <label>Tag</label>
          <select id="campo-tag">
            <option value="Lead">Lead</option>
            <option value="VIP">VIP</option>
            <option value="Inativo">Inativo</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btn-cancelar">Cancelar</button>
        <button id="btn-salvar">Salvar</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/clientes.js"></script>

</body>
</html>

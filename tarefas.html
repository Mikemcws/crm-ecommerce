<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM | Tarefas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h2>📦 CRM Store</h2>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </a>
      <a href="clientes.html" class="nav-item">
        <span class="nav-icon">👥</span>
        <span>Clientes</span>
      </a>
      <a href="leads.html" class="nav-item">
        <span class="nav-icon">🎯</span>
        <span>Leads</span>
      </a>
      <a href="tarefas.html" class="nav-item active">
        <span class="nav-icon">✅</span>
        <span>Tarefas</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button id="btn-logout">🚪 Sair</button>
    </div>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main-content">
    <header class="page-header">
      <div>
        <h1>Tarefas</h1>
        <p>Seus follow-ups e compromissos</p>
      </div>
      <button id="btn-nova-tarefa">+ Nova Tarefa</button>
    </header>

    <!-- FILTROS -->
    <div class="acoes-bar">
      <div class="filtros">
        <button class="filtro-btn active" data-filtro="todas">Todas</button>
        <button class="filtro-btn" data-filtro="pendentes">Pendentes</button>
        <button class="filtro-btn" data-filtro="concluidas">Concluídas</button>
        <button class="filtro-btn" data-filtro="atrasadas">Atrasadas</button>
      </div>
    </div>

    <!-- LISTA DE TAREFAS -->
    <div id="lista-tarefas"></div>
  </main>

  <!-- MODAL -->
  <div id="modal-tarefa" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Nova Tarefa</h2>
        <button id="btn-fechar-modal-tarefa">✕</button>
      </div>

      <div class="modal-body">
        <div class="input-group">
          <label>Título</label>
          <input type="text" id="tarefa-titulo" placeholder="Ex: Ligar pro cliente João">
        </div>
        <div class="input-group">
          <label>Prazo</label>
          <input type="date" id="tarefa-prazo">
        </div>
        <div class="input-group">
          <label>Prioridade</label>
          <select id="tarefa-prioridade">
            <option value="Alta">🔴 Alta</option>
            <option value="Média">🟡 Média</option>
            <option value="Baixa">🟢 Baixa</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btn-cancelar-tarefa">Cancelar</button>
        <button id="btn-salvar-tarefa">Salvar</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tarefas.js"></script>

</body>
</html>
